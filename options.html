<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Social QR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --ink:#1a1d1e;
    --paper:#eef1ee;
    --card:#ffffff;
    --line:#d9ddd8;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    background:var(--paper);
    color:var(--ink);
    font-family:'Segoe UI', Tahoma, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }
  .card{
    background:var(--card);
    width:100%;
    max-width:380px;
    border-radius:20px;
    padding:28px 24px 32px;
    box-shadow:0 30px 60px -30px rgba(0,0,0,0.25);
    text-align:center;
  }
  h1{ font-size:22px; margin:0 0 4px; letter-spacing:-0.01em; }
  p.sub{ margin:0 0 24px; font-size:14px; color:#6b7069; }
  .switch{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:8px;
    background:var(--paper);
    border-radius:12px;
    padding:5px;
    margin-bottom:24px;
  }
  .switch button{
    border:none; background:transparent; padding:10px 4px;
    font-size:12px; font-weight:600; border-radius:9px; cursor:pointer;
    color:#6b7069; transition:background .2s, color .2s;
  }
  .switch button.active{
    background:var(--card); color:var(--ink);
    box-shadow:0 2px 6px rgba(0,0,0,0.08);
  }
  #qr-holder{
    width:220px; height:220px; margin:0 auto 18px;
    display:flex; align-items:center; justify-content:center;
    background:#fff; border-radius:16px; border:1px solid var(--line);
  }
  .platform-name{ font-size:15px; font-weight:700; margin-bottom:2px; }
  .platform-value{ font-size:13px; color:#6b7069; word-break:break-all; }

  .open-btn{
    display:inline-block;
    margin-top:18px;
    padding:12px 22px;
    background:var(--ink);
    color:#fff;
    text-decoration:none;
    font-size:14px;
    font-weight:600;
    border-radius:10px;
  }

  .hint{
    margin-top:12px;
    font-size:11px;
    color:#9a9e97;
    line-height:1.5;
  }
</style>
</head>
<body>

  <div class="card">
    <h1>Connect With Me</h1>
    <p class="sub">Choose a platform below and scan the QR</p>

    <div class="switch">
      <button class="tab-btn active" data-platform="whatsapp">WhatsApp</button>
      <button class="tab-btn" data-platform="instagram">Instagram</button>
      <button class="tab-btn" data-platform="facebook">Facebook</button>
      <button class="tab-btn" data-platform="tiktok">TikTok</button>
      <button class="tab-btn" data-platform="website">Website</button>
    </div>

    <div id="qr-holder"></div>

    <div class="platform-name" id="platform-name">WhatsApp</div>
    <div class="platform-value" id="platform-value">+92 300 0857788</div>

    <a id="open-link" href="#" class="open-btn">Open Directly</a>
    <p class="hint">Tapped "Open Directly"? Just use your phone's<br>back button to return here and pick another.</p>
  </div>

<script>
  const profiles = {
    whatsapp:  { link: "https://wa.me/923000857788", label: "WhatsApp", display: "+92 300 0857788" },
    instagram: { link: "https://instagram.com/jantours.official", label: "Instagram", display: "@jantours.official" },
    facebook:  { link: "https://www.facebook.com/JanTours", label: "Facebook", display: "JanTours" },
    tiktok:    { link: "https://www.tiktok.com/@jantours.official?_r=1&_t=ZS-99SYKQLTf9Q", label: "TikTok", display: "@jantours.official" },
    website:   { link: "https://www.jan-tours.com", label: "Website", display: "jan-tours.com" }
  };

  const holder = document.getElementById('qr-holder');
  const nameEl = document.getElementById('platform-name');
  const valueEl = document.getElementById('platform-value');
  const openLink = document.getElementById('open-link');
  const buttons = document.querySelectorAll('.tab-btn');

  function renderQR(platformKey){
    const data = profiles[platformKey];
    holder.innerHTML = "";
    new QRCode(holder, {
      text: data.link, width: 200, height: 200,
      colorDark: "#1a1d1e", colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });
    nameEl.textContent = data.label;
    valueEl.textContent = data.display;
    openLink.href = data.link;
  }

  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderQR(btn.dataset.platform);
    });
  });

  renderQR('whatsapp');
</script>

</body>
</html>
